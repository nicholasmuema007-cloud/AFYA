<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causes of Malaria Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Registration Form</h1>
  <form action="#" method="post"></form>
  <label for="fname">First Name</label><br>
  <input type="text" id="fname" name="First Name" placeholder="enter First Name" required><br>
  <label for="fname">Second Name</label><br>
  <input type="text" id="sname" name="Second Name" placeholder="enter Second Name" required><br>

  <input type="text" id="phoneNumber" name="Phone Number" placeholder="enter Phone Number" required><br>
  <label for="age">Age</label><br>
  <input type="text" id="age" name="Age" placeholder="enter Age" required><br>
  <label>Gender:</label><br>
  <input type="radio" id="male" name="gender">

  <input type="radio" id="female" name="gender">
  <label for="male">Female</label><br><br>
  <label for="password">Password</label><br>
  <input type="text" id="password" name="Password" placeholder="enter Password" required><br>
  <label for="password">Confirm Password</label><br>
  <input type="text" id="confirmPassword" name="confirmPassword" placeholder=" Confirm Password" required><br>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">

</body>

</html>
